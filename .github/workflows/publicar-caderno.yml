name: Publicar Caderno Premium

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Caderno V19
        run: unzip -q BAIXAR_CADERNO_V19.zip -d pacote

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar aplicativo
        uses: actions/upload-pages-artifact@v3
        with:
          path: pacote

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
